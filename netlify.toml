[build]
  publish = "public"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # jsdom does dynamic requires and pulls an optional native dep (canvas), which
  # esbuild cannot bundle. Netlify installs it into the function zip instead.
  external_node_modules = ["jsdom"]

# MCP connector endpoint. The token may travel as a path segment (/mcp/<token>)
# because query strings are dropped by URL normalisation in some clients.
[[redirects]]
  from = "/mcp"
  to = "/.netlify/functions/mcp"
  status = 200
  force = true

[[redirects]]
  from = "/mcp/*"
  to = "/.netlify/functions/mcp"
  status = 200
  force = true

# Block internal project files from public access
# force = true is required to override actual files on disk
[[redirects]]
  from = "/CLAUDE.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/ROADMAP.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/CALLER-PROMPT.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/TOOL-BRIEF.md"
  to = "/404.html"
  status = 404
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
