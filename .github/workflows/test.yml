name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # No network and no Notion credentials are needed: the suite covers the
      # conversion and status logic against fixtures. That is deliberate — the
      # failures worth catching here are the invisible ones (content duplicated
      # on retry, text truncated at a limit, a clip reported that never
      # happened), and none of them need a live workspace to reproduce.
      - name: Test
        run: npm test
